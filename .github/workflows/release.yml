# One workflow for a version tag: test, then ship the Windows installer.
# The installer job does not start when a test fails.
# Branch pushes and pull requests do not start this workflow.
# Manual dispatch runs the tests only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: typecheck + vitest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  release:
    name: Windows installer → GitHub Release
    needs: test
    # Tags ship an installer; workflow_dispatch is tests only.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        env:
          # No code-signing cert in CI. signExecutable is also false in package.json.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter "WildcardsManager-*.exe" -File
          if (-not $exe) { throw "release/ is missing WildcardsManager-*.exe" }
          $exe | Format-List Name, Length

      # The zip is gitignored. Pack it from the tracked comfyui-lora-training/ tree.
      - name: Pack comfyui-lora-training.zip
        shell: pwsh
        run: |
          $root = (Resolve-Path "comfyui-lora-training").Path
          $dest = Join-Path (Resolve-Path "ComfyUI-Workflow").Path "comfyui-lora-training.zip"
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open($dest, "Create")
          try {
            Get-ChildItem $root -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($root.Length).TrimStart("\", "/")
              $entry = "comfyui-lora-training/" + ($rel -replace "\\", "/")
              [void][System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $_.FullName, $entry)
            }
          } finally {
            $zip.Dispose()
          }
          if (-not (Test-Path $dest)) { throw "comfyui-lora-training.zip was not created" }

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Wildcards Manager ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release/WildcardsManager-*.exe
            release/*.exe.blockmap
            release/latest.yml
            ComfyUI-Workflow/comfyui-lora-training.zip
            ComfyUI-Workflow/comfyui-custom-save-node.zip
            ComfyUI-Workflow/WildcardManager-ComfyUI-Krea2-Generation-Workflow.json
            ComfyUI-Workflow/WildcardManager-ComfyUI-SDXL-Generation-Workflow.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
