# Check + ship the NSIS installer only for version tags (GitHub Release).
# Branch / PR pushes are covered by tests.yml.
name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  release:
    name: Windows installer → GitHub Release
    needs: check
    # Tags ship an installer; workflow_dispatch is check-only (no release attach).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        env:
          # No code-signing cert in CI. signExecutable is also false in package.json.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter "WildcardsManager-*.exe" -File
          if (-not $exe) { throw "release/ is missing WildcardsManager-*.exe" }
          $exe | Format-List Name, Length

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Wildcards Manager ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release/WildcardsManager-*.exe
            release/*.exe.blockmap
            release/latest.yml
            ComfyUI-Workflow/comfyui-lora-training.zip
            ComfyUI-Workflow/WildcardManager-ComfyUI-Generation-Workflow.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
